spring.application.name=estilo-ia
spring.config.import=optional:file:./application-secrets.properties

spring.datasource.url=jdbc:h2:file:./data/estiloia;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Configuracion JWT
app.jwt.secret=ESTILOIA_SUPER_SECRET_KEY_2026_SEGURA_PARA_DESARROLLO_LOCAL
app.jwt.expiration-ms=86400000
# Subida de imagenes
app.upload.dir=uploads
app.ai.provider=gemini
app.ai.url=https://generativelanguage.googleapis.com/v1beta/models
app.ai.api-key=${AI_API_KEY:${GEMINI_API_KEY:${GROQ_API_KEY:}}}
app.ai.model=gemini-3.5-flash
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.h2.console.path=/h2-console
spring.h2.console.enabled=true
