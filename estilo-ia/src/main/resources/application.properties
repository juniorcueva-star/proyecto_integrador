spring.application.name=estilo-ia

spring.datasource.url=jdbc:mysql://localhost:3306/estilo_ia?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# Configuracion JWT
app.jwt.secret=ESTILOIA_SUPER_SECRET_KEY_2026_SEGURA_PARA_DESARROLLO_LOCAL
app.jwt.expiration-ms=86400000
# Subida de imagenes
app.upload.dir=uploads
app.ai.provider=gemini
app.ai.url=https://generativelanguage.googleapis.com/v1beta/models
app.ai.api-key=${AI_API_KEY:${GEMINI_API_KEY:${GROQ_API_KEY:}}}
app.ai.model=gemini-3.5-flash

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
