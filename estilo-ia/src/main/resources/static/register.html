<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Estilo IA</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/auth.js" defer></script>
</head>
<body class="auth-body">
<main class="auth-card">
    <h1>Crear cuenta</h1>
    <p>Unete a la moda sostenible.</p>

    <form id="registerForm" class="form">
        <label>Nombre</label>
        <input
                type="text"
                id="nombre"
                required
                minlength="3"
                maxlength="60"
                pattern="[A-Za-z ]+"
                placeholder="Tu nombre real"
        >

        <label>Email</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">

        <label>Telefono o WhatsApp</label>
        <input
                type="text"
                id="telefono"
                required
                maxlength="9"
                pattern="9[0-9]{8}"
                inputmode="numeric"
                placeholder="987654321"
                oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9)"
        >

        <label>Contrasena</label>
        <input type="password" id="password" required minlength="6" placeholder="Minimo 6 caracteres">

        <button type="submit" class="btn btn-primary">Registrarme</button>
    </form>

    <p class="small-text">
        Ya tienes cuenta? <a href="/login.html">Inicia sesion</a>
    </p>

    <div id="message" class="message"></div>
</main>
</body>
</html>
